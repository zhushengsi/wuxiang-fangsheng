<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头陀度假村 - 无相布施助手</title>
    <style>
        :root {
            --primary-color: #2e7d32; /* 禅意绿 */
            --bg-color: #f7f9f7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #d84315; /* 强调色 */
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 25px;
        }

        /* 布施码生成区域 */
        .code-box {
            background: #f0f7f0;
            border: 1px dashed var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .generated-code {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 2px;
            margin: 10px 0;
            min-height: 40px; /* 占位防止跳动 */
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
            width: 100%;
            max-width: 200px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* 捐款档位区域 */
        .donation-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .tiers-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .tier-btn {
            flex: 1;
            background: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 15px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tier-btn:hover, .tier-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .random-amount-display {
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: bold;
            height: 30px;
        }

        /* 查询与活动展示 */
        .info-links {
            margin-top: 30px;
            text-align: left;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
        }

        .info-links h3 {
            font-size: 1rem;
            margin-top: 0;
            color: #444;
        }

        .info-links a {
            color: var(--primary-color);
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>头陀度假村 · 无相布施</h1>
    <p class="subtitle">以码代名，随心随缘，功德无量</p>

    <!-- 1. 无相布施码生成器 -->
    <div class="code-box">
        <p style="margin:0; font-size:0.9rem;">点击下方获取您的专属布施码</p>
        <div class="generated-code" id="displayCode">------</div>
        <button class="btn" onclick="generateCode()">获取布施码</button>
    </div>

    <!-- 2. 随机金额捐款区 -->
    <div class="donation-section">
        <h3>选择心意档位 (随机金额)</h3>
        <p style="font-size:0.8rem; color:#666;">系统将自动计算随机整数金额，破除执着</p>
        
        <div class="tiers-container">
            <!-- 这里的范围可以根据需要修改，例如 1-10, 10-50 -->
            <button class="tier-btn" onclick="handleDonation(1, 10)">随喜<br><span style="font-size:0.7em">1-10元</span></button>
            <button class="tier-btn" onclick="handleDonation(10, 50)">护持<br><span style="font-size:0.7em">10-50元</span></button>
            <button class="tier-btn" onclick="handleDonation(50, 100)">圆满<br><span style="font-size:0.7em">50-100元</span></button>
        </div>

        <div class="random-amount-display" id="amountDisplay"></div>
    </div>

    <!-- 3. 查询链接与活动展示 -->
    <div class="info-links">
        <h3>📢 动态与查询</h3>
        <!-- 这里嵌入了您提供的金山文档链接 -->
        <a href="https://www.kdocs.cn/etapps/query/q/tsni23IQ" target="_blank">
            👉 点击此处前往金山文档查询布施记录
        </a>
        <a href="#" onclick="alert('此处可放置度假村建设进展的图片或文字详情')">
            🏞️ 查看度假村建设动态图文
        </a>
    </div>

    <div class="footer-note">
        注：本页面为静态演示，实际支付需跳转微信支付。
    </div>
</div>

<script>
    // 1. 生成布施码逻辑
    function generateCode() {
        // 生成规则：WX + 时间戳后4位 + 随机3位数
        const randomPart = Math.floor(Math.random() * 900) + 100; 
        const timePart = new Date().getTime().toString().slice(-4);
        const code = `WX${timePart}${randomPart}`;
        
        document.getElementById('displayCode').innerText = code;
        document.getElementById('displayCode').style.color = '#d84315'; // 高亮显示
        
        // 简单的动画效果
        setTimeout(() => {
            document.getElementById('displayCode').style.color = '#2e7d32';
        }, 500);
    }

    // 2. 处理捐款逻辑（随机金额）
    function handleDonation(min, max) {
        // 检查是否已生成布施码（可选逻辑，如果允许不生成直接捐则注释掉）
        const currentCode = document.getElementById('displayCode').innerText;
        if (currentCode === '------') {
            alert('请先点击上方按钮获取您的“无相布施码”');
            return;
        }

        // 生成随机整数金额
        const randomAmount = Math.floor(Math.random() * (max - min + 1)) + min;
        
        // 显示金额
        const displayDiv = document.getElementById('amountDisplay');
        displayDiv.innerText = `本次随喜金额：¥ ${randomAmount}`;

        // 模拟跳转微信支付
        // 注意：真实场景下，这里应该跳转到一个能接收金额的支付链接
        // 由于是静态页，这里演示跳转到微信收款码页面或提示
        setTimeout(() => {
            if(confirm(`系统已为您选定随喜金额：${randomAmount}元。\n\n将使用布施码：${currentCode}\n\n是否立即前往支付？`)) {
                // 这里替换为您真实的微信收款链接或支付二维码页面链接
                // window.location.href = "weixin://..."; 
                alert("正在唤起微信支付... (此处需配置真实支付链接)");
            }
        }, 800);
    }
</script>

</body>
</html>
